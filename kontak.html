<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Kelurahan Pasar Melintang</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- Navbar (sama) -->
    <nav class="navbar"> ... </nav>

    <!-- Hero Mini -->
    <header class="hero" style="min-height: 40vh; padding: 120px 0 60px;">
        <div class="hero-content" style="grid-template-columns: 1fr;">
            <div class="hero-text text-center">
                <h1>Hubungi Kami</h1>
                <p>Sampaikan aspirasi atau kebutuhan Anda</p>
            </div>
        </div>
        <div class="hero-wave"> ... </div>
    </header>

    <!-- Konten Kontak -->
    <section style="padding: 60px 0; background: var(--white);">
        <div class="container">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1100px; margin: 0 auto;">
                <!-- Info Kontak -->
                <div>
                    <h2 style="color: var(--primary); margin-bottom: 25px;">Informasi Kontak</h2>
                    <div style="margin-bottom: 25px;">
                        <p style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                            <i class="fas fa-map-marker-alt" style="font-size: 1.4rem; color: var(--accent); width: 30px;"></i>
                            <span>Jl. Pasar Melintang No. 1, Kecamatan Melintang</span>
                        </p>
                        <p style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                            <i class="fas fa-phone" style="font-size: 1.4rem; color: var(--accent); width: 30px;"></i>
                            <span>(021) 1234-5678</span>
                        </p>
                        <p style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                            <i class="fas fa-envelope" style="font-size: 1.4rem; color: var(--accent); width: 30px;"></i>
                            <span>kelurahan@pmelintang.go.id</span>
                        </p>
                        <p style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                            <i class="fas fa-clock" style="font-size: 1.4rem; color: var(--accent); width: 30px;"></i>
                            <span>Senin-Jumat: 08.00-16.00 WIB</span>
                        </p>
                    </div>
                    
                    <!-- Google Maps Embed -->
                    <div style="border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-top: 20px;">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989.5!2d101.4!3d0.5!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMMKwMzAnMDAuMCJOIDEwMcKwMjQnMDAuMCJF!5e0!3m2!1sid!2sid!4v1234567890" 
                            width="100%" 
                            height="250" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
                
                <!-- Form Kontak -->
                <div style="background: var(--light); padding: 35px; border-radius: var(--radius);">
                    <h2 style="color: var(--primary); margin-bottom: 25px;">Kirim Pesan</h2>
                    <form>
                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Nama Lengkap</label>
                            <input type="text" placeholder="Masukkan nama Anda" style="width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; transition: var(--transition);">
                        </div>
                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Email</label>
                            <input type="email" placeholder="Masukkan email Anda" style="width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; transition: var(--transition);">
                        </div>
                        <div style="margin-bottom: 18px;">
                            <label style="display: block; font-weight: 600; margin-bottom: 6px;">Pesan</label>
                            <textarea rows="5" placeholder="Tulis pesan Anda..." style="width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; resize: vertical; transition: var(--transition);"></textarea>
                        </div>
                        <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">
                            <i class="fas fa-paper-plane"></i> Kirim Pesan
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer"> ... </footer>

    <script src="js/script.js"></script>
</body>
</html>
